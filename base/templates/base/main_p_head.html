{% load static %}

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: url("{% static 'background.png' %}") repeat;
        background-size: auto;
    }

    header {
        background-color: black;
        padding: 15px 30px;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
    }

    main {
        padding-top: 80px;
    }

    header nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
    }

    header nav img {
        height: 50px;
        cursor: pointer;
    }

    header nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 18px;
        transition: color 0.3s ease;
    }

    header nav a:hover {
        color: #ff6600;
    }

    .search-bar {
        display: flex;
        align-items: center;
        margin: 0 50px;
    }

    .search-bar input {
        padding: 8px 12px;
        border: none;
        border-radius: 6px 0 0 6px;
        outline: none;
        width: 220px;
        font-size: 14px;
    }

    .search-bar button {
        padding: 8px 15px;
        border: none;
        border-radius: 0 6px 6px 0;
        background-color: #ff6600;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    .search-bar button:hover {
        background-color: #e65c00;
    }
</style>

<header>
    <nav>
        <a href="{% url 'home' %}">
            <img src="{% static 'logo.png' %}" alt="Logo">
        </a>

        {% if user.is_authenticated %}
            <a href="{% url 'category_list' %}">Меню</a>
            <a href="{% url 'cart_detail' %}">Кошик</a>
            <a href="{% url 'order_list' %}">Історія замовлень</a>

            <form class="search-bar" method="get" action="{% url 'search' %}">
                <input type="text" name="q" placeholder="Пошук страв...">
                <button type="submit">🔍</button>
            </form>

            <a href="{% url 'profile' %}">Профіль</a>
            {% if user.role == "admin" %}
                <a href="{% url 'admin:index' %}">Admin</a>
            {% endif %}
        {% else %}
            <form class="search-bar" method="get" action="{% url 'search' %}">
                <input type="text" name="q" placeholder="Пошук страв...">
                <button type="submit">🔍</button>
            </form>

            <a href="{% url 'login' %}">Увійти</a>
            <a href="{% url 'register' %}">Реєстрація</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>
