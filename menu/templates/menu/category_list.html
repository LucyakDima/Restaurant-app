<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Категорії</title>
    {% load static %}
    <style>
        body {
            padding: 2% 8%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .category-card {
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .category-card:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .category-img-wrapper {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .category-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .category-placeholder {
            width: 100%;
            height: 100%;
            background-color: #eee;
            border-radius: 8px;
        }

        .category-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #333;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .category-card a:hover {
            background-color: #e65c00;
        }
    </style>
</head>
<body>
{% include 'base/main_p_head.html' %}

<h2>Категорії страв</h2>
<div class="categories-container">
    {% for category in categories %}
        <div class="category-card">
            <div class="category-img-wrapper">
                {% if category.image %}
                    <img src="{{ category.image.url }}" alt="{{ category.name }}" class="category-img">
                {% else %}
                    <div class="category-placeholder"></div>
                {% endif %}
            </div>
            <h3>{{ category.name }}</h3>
            <a href="{% url 'dish_list' category.id %}" class="btn">Переглянути</a>
        </div>
    {% empty %}
        <p>Категорій немає</p>
    {% endfor %}
</div>

</body>
</html>
