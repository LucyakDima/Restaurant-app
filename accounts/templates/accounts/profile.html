<h2>Мій профіль</h2>

<p><strong>Username:</strong> {{ user.username }}</p>
<p><strong>Email:</strong> {{ user.email }}</p>
<p><strong>Ім'я:</strong> {{ user.first_name }}</p>
<p><strong>Прізвище:</strong> {{ user.last_name }}</p>
<p><strong>Телефон:</strong> {{ user.phone_number }}</p>

<a href="{% url 'edit_profile' %}"> Редагувати профіль</a>
<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Ви впевнені, що хочете вийти?');"> Вийти</button>
</form>
